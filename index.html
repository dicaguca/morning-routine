<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Ritual</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F59E0B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3Cpath d='M12 2v2'/%3E%3Cpath d='M12 20v2'/%3E%3Cpath d='m4.93 4.93 1.41 1.41'/%3E%3Cpath d='m17.66 17.66 1.41 1.41'/%3E%3Cpath d='M2 12h2'/%3E%3Cpath d='M20 12h2'/%3E%3Cpath d='m6.34 17.66-1.41 1.41'/%3E%3Cpath d='m19.07 4.93-1.41 1.41'/%3E%3C/svg%3E">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        .sun-animation { animation: sunrise 4s ease-in-out; }
        @keyframes sunrise {
            0% { transform: translateY(100px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-20px); opacity: 1; }
        }
        .rays { animation: rotating 8s linear infinite; }
        @keyframes rotating {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .fade-out { animation: fadeOut 1s ease-in-out forwards; }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-in { animation: fadeIn 1s ease-in-out; }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .editor-surface {
            min-height: 260px;
            outline: none;
            line-height: 1.55;
            word-break: break-word;
        }
        .editor-surface.editor-empty::before {
            content: attr(data-placeholder);
            color: #9ca3af;
        }
        .editor-surface ul {
            list-style: disc;
            margin: 0 0 0 1.25rem;
            padding: 0;
        }
        .editor-surface p,
        .editor-surface div {
            margin: 0 0 0.45rem;
        }
        .editor-surface p[data-spacing="m"],
        .editor-surface div[data-spacing="m"] {
            margin-bottom: 8pt;
        }
        .editor-surface p[data-spacing="l"],
        .editor-surface div[data-spacing="l"] {
            margin-bottom: 10pt;
        }
        .editor-surface p[data-spacing="xl"],
        .editor-surface div[data-spacing="xl"] {
            margin-bottom: 12pt;
        }
        .editor-surface p:last-child,
        .editor-surface div:last-child {
            margin-bottom: 0;
        }
        .editor-surface-relaxed p,
        .editor-surface-relaxed div {
            margin-bottom: 1rem;
        }
        .editor-surface-relaxed p[data-spacing="m"],
        .editor-surface-relaxed div[data-spacing="m"] {
            margin-bottom: 12pt;
        }
        .editor-surface-relaxed p[data-spacing="l"],
        .editor-surface-relaxed div[data-spacing="l"] {
            margin-bottom: 14pt;
        }
        .editor-surface-relaxed p[data-spacing="xl"],
        .editor-surface-relaxed div[data-spacing="xl"] {
            margin-bottom: 16pt;
        }
        .editor-surface font[size="2"] {
            font-size: 0.85rem;
        }
        .editor-surface font[size="3"] {
            font-size: 1rem;
        }
        .editor-surface font[size="4"] {
            font-size: 1.12rem;
        }
        .editor-surface font[size="5"] {
            font-size: 1.32rem;
        }
        .editor-surface font[size="6"] {
            font-size: 1.6rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        /* @jsxRuntime classic */
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEYS = {
            mantras: 'morningRitualMantrasContent',
            lessons: 'morningRitualLessonsContent'
        };

        const STARTER_CONTENT = {
            mantras: `
                <p><strong>This week I choose steady joy.</strong></p>
                <p>I trust my path, honor my rhythm, and speak to myself with kindness.</p>
                <ul><li>I move with clarity.</li><li>I welcome abundance.</li><li>I stay grounded in love.</li></ul>
            `,
            lessons: `
                <p><strong>Weekly reflection prompt:</strong> What strengthened me this week, and what wants more compassion?</p>
                <p>Capture one lesson you want to carry forward and one belief you are ready to release.</p>
                <ul><li>Lesson worth keeping</li><li>Pattern to improve</li><li>Next wise step</li></ul>
            `
        };

        const MODAL_STEP_CONFIG = {
            4: {
                key: 'mantras',
                title: 'Mantras',
                headerLabel: 'MORNING RITUAL ⋆ MANTRAS',
                storageKey: STORAGE_KEYS.mantras,
                placeholder: 'Write your mantras and affirmations here...'
            },
            5: {
                key: 'lessons',
                title: 'Lessons & Wisdom',
                headerLabel: 'MORNING RITUAL ⋆ LESSONS',
                storageKey: STORAGE_KEYS.lessons,
                placeholder: 'Capture your lessons, insights, and wisdom here...',
                editorClassName: 'editor-surface-relaxed'
            }
        };

        const TOTAL_STEPS = 10;

        const FONT_SIZE_OPTIONS = [
            { label: 'XS', value: '2' },
            { label: 'S', value: '3' },
            { label: 'M', value: '4' },
            { label: 'L', value: '5' },
            { label: 'XL', value: '6' }
        ];

        const getScreenFromHash = () => {
            const normalizedHash = window.location.hash.replace(/^#\/?/, '');
            const stepMatch = normalizedHash.match(/^step(\d+)$/i);

            if (stepMatch) {
                const stepNumber = parseInt(stepMatch[1], 10);
                if (stepNumber >= 1 && stepNumber <= TOTAL_STEPS) {
                    return `step-${stepNumber}`;
                }
            }

            if (normalizedHash === 'welcome') return 'welcome';
            if (normalizedHash === 'complete') return 'complete';
            if (normalizedHash === 'sunrise') return 'sunrise';

            return null;
        };

        const getHashFromScreen = (screen) => {
            if (screen.startsWith('step-')) {
                const stepNumber = parseInt(screen.split('-')[1], 10);
                return `#/step${stepNumber}`;
            }

            if (screen === 'welcome') return '#/welcome';
            if (screen === 'complete') return '#/complete';
            if (screen === 'sunrise') return '#/sunrise';

            return '#/';
        };

        const normalizeEditorHtml = (html) => {
            if (!html) return '';
            const trimmed = html.replace(/\u200B/g, '').trim();
            return trimmed === '<br>' || trimmed === '<div><br></div>' ? '' : html;
        };

        const applyEditorSpacing = (root) => {
            if (!root) return;

            Array.from(root.querySelectorAll('p')).forEach((block) => {
                const sizeValues = [block, ...block.querySelectorAll('font[size]')]
                    .map((node) => parseInt(node.getAttribute && node.getAttribute('size'), 10))
                    .filter((value) => !Number.isNaN(value));

                const maxSize = sizeValues.length ? Math.max(...sizeValues) : 3;
                let spacing = 'default';

                if (maxSize >= 6) spacing = 'xl';
                else if (maxSize === 5) spacing = 'l';
                else if (maxSize === 4) spacing = 'm';

                block.setAttribute('data-spacing', spacing);
            });
        };

        const normalizeEditorStructure = (root) => {
            if (!root) return;

            const childNodes = Array.from(root.childNodes);
            if (childNodes.length === 0) {
                root.innerHTML = '<p><br></p>';
                return;
            }

            childNodes.forEach((node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent || '';
                    if (text.trim()) {
                        const paragraph = document.createElement('p');
                        paragraph.textContent = text;
                        root.replaceChild(paragraph, node);
                    } else {
                        root.removeChild(node);
                    }
                    return;
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return;
                }

                const tagName = node.tagName.toLowerCase();

                if (tagName === 'div') {
                    const paragraph = document.createElement('p');
                    while (node.firstChild) {
                        paragraph.appendChild(node.firstChild);
                    }
                    root.replaceChild(paragraph, node);
                    return;
                }

                if (tagName === 'br') {
                    const paragraph = document.createElement('p');
                    paragraph.appendChild(document.createElement('br'));
                    root.replaceChild(paragraph, node);
                    return;
                }

                if (tagName !== 'p' && tagName !== 'ul') {
                    const paragraph = document.createElement('p');
                    root.replaceChild(paragraph, node);
                    paragraph.appendChild(node);
                }
            });

            if (!root.querySelector('p, ul')) {
                root.innerHTML = '<p><br></p>';
            }
        };

        const prepareEditorDom = (root) => {
            normalizeEditorStructure(root);
            applyEditorSpacing(root);
        };

        const syncEditorPresentation = (root) => {
            if (!root) return;
            applyEditorSpacing(root);
        };

        const getStoredContent = (storageKey, fallback) => {
            const saved = window.localStorage.getItem(storageKey);
            return saved && saved.trim() ? saved : fallback;
        };

        const saveStoredContent = (storageKey, content) => {
            window.localStorage.setItem(storageKey, content);
        };

        const ToolbarButton = ({ label, onClick, title, className = '' }) => (
            <button
                type="button"
                onClick={onClick}
                title={title}
                aria-label={title}
                className={`inline-flex h-9 min-w-9 items-center justify-center rounded-xl bg-orange-50 px-2.5 py-1.5 text-gray-700 font-semibold text-sm hover:bg-orange-100 transition-colors ${className}`}
            >
                {label}
            </button>
        );

        const ListIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M7 5h8"></path>
                <path d="M7 10h8"></path>
                <path d="M7 15h8"></path>
                <circle cx="4" cy="5" r="0.9" fill="currentColor" stroke="none"></circle>
                <circle cx="4" cy="10" r="0.9" fill="currentColor" stroke="none"></circle>
                <circle cx="4" cy="15" r="0.9" fill="currentColor" stroke="none"></circle>
            </svg>
        );

        const AlignLeftIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M4 5h11"></path>
                <path d="M4 8.5h8"></path>
                <path d="M4 12h11"></path>
                <path d="M4 15.5h7"></path>
            </svg>
        );

        const AlignCenterIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M4.5 5h11"></path>
                <path d="M6.5 8.5h7"></path>
                <path d="M4.5 12h11"></path>
                <path d="M6.5 15.5h7"></path>
            </svg>
        );

        const AlignRightIcon = ({ className = 'h-4 w-4' }) => (
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className={className}>
                <path d="M5 5h11"></path>
                <path d="M8 8.5h8"></path>
                <path d="M5 12h11"></path>
                <path d="M9 15.5h7"></path>
            </svg>
        );

        const RichTextModal = ({ isOpen, title, headerLabel, storageKey, starterContent, placeholder, editorClassName = '', onClose }) => {
            const editorRef = useRef(null);
            const selectionRef = useRef(null);
            const [isEmpty, setIsEmpty] = useState(false);

            useEffect(() => {
                if (!isOpen) return;
                const nextContent = getStoredContent(storageKey, starterContent);
                if (editorRef.current) {
                    document.execCommand('defaultParagraphSeparator', false, 'p');
                    editorRef.current.innerHTML = nextContent;
                    prepareEditorDom(editorRef.current);
                    setIsEmpty(!normalizeEditorHtml(editorRef.current.innerHTML));
                } else {
                    setIsEmpty(!normalizeEditorHtml(nextContent));
                }
            }, [isOpen, storageKey, starterContent]);

            useEffect(() => {
                if (!isOpen) return;
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    document.body.style.overflow = previousOverflow;
                };
            }, [isOpen]);

            useEffect(() => {
                if (!isOpen || !editorRef.current) return;
                requestAnimationFrame(() => editorRef.current.focus());
            }, [isOpen]);

            if (!isOpen) return null;

            const persistEditorContent = () => {
                if (!editorRef.current) return;
                syncEditorPresentation(editorRef.current);
                const nextContent = normalizeEditorHtml(editorRef.current.innerHTML);
                setIsEmpty(!nextContent);
                saveStoredContent(storageKey, nextContent || starterContent);
            };

            const saveSelection = () => {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0) {
                    selectionRef.current = selection.getRangeAt(0);
                }
            };

            const restoreSelection = () => {
                const selection = window.getSelection();
                if (selection && selectionRef.current) {
                    selection.removeAllRanges();
                    selection.addRange(selectionRef.current);
                }
            };

            const runCommand = (command, value = null) => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                restoreSelection();
                document.execCommand(command, false, value);
                prepareEditorDom(editorRef.current);
                persistEditorContent();
                saveSelection();
            };

            const handleEditorKeyDown = (event) => {
                if (event.key !== 'Enter') return;

                event.preventDefault();
                editorRef.current.focus();
                restoreSelection();

                if (event.shiftKey) {
                    document.execCommand('insertLineBreak', false, null);
                } else {
                    document.execCommand('insertParagraph', false, null);
                }

                syncEditorPresentation(editorRef.current);
                persistEditorContent();
                saveSelection();
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/35 backdrop-blur-sm px-3 py-4 sm:px-5 sm:py-5"
                    onClick={onClose}
                >
                    <div
                        className="flex h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-[28px] border border-white/70 bg-gradient-to-br from-orange-50 via-white to-pink-50 shadow-2xl sm:h-[94vh]"
                        onClick={(event) => event.stopPropagation()}
                    >
                        <div className="flex items-center justify-between gap-4 border-b border-orange-100 px-5 py-3 sm:px-6 sm:py-3.5">
                            <div className="pt-0.5">
                                <p className="text-xs font-bold uppercase tracking-[0.2em] text-orange-500">{headerLabel}</p>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/80 text-gray-500 transition-colors hover:bg-white hover:text-gray-700"
                                aria-label={`Close ${title}`}
                            >
                                &#10005;
                            </button>
                        </div>

                        <div className="flex min-h-0 flex-1 flex-col px-4 py-3 sm:px-6 sm:py-4">
                            <div className="mb-3 flex flex-wrap gap-1.5 rounded-2xl bg-white/80 p-2 shadow-sm">
                                <ToolbarButton label="B" title="Bold" onClick={() => runCommand('bold')} className="font-bold" />
                                <ToolbarButton label="I" title="Italic" onClick={() => runCommand('italic')} className="italic" />
                                <ToolbarButton label="U" title="Underline" onClick={() => runCommand('underline')} className="underline" />
                                <ToolbarButton label={<ListIcon />} title="Bullet List" onClick={() => runCommand('insertUnorderedList')} />
                                <ToolbarButton label={<AlignLeftIcon />} title="Align Left" onClick={() => runCommand('justifyLeft')} />
                                <ToolbarButton label={<AlignCenterIcon />} title="Align Center" onClick={() => runCommand('justifyCenter')} />
                                <ToolbarButton label={<AlignRightIcon />} title="Align Right" onClick={() => runCommand('justifyRight')} />
                                <label className="ml-auto min-w-[88px] sm:min-w-[96px]">
                                    <span className="sr-only">Font size</span>
                                    <select
                                        defaultValue="4"
                                        onChange={(event) => runCommand('fontSize', event.target.value)}
                                        className="h-9 w-full rounded-xl border border-orange-100 bg-orange-50 px-3 py-1 text-sm font-semibold text-gray-700 outline-none focus:border-orange-300"
                                    >
                                        {FONT_SIZE_OPTIONS.map((option) => (
                                            <option key={option.value} value={option.value}>{option.label}</option>
                                        ))}
                                    </select>
                                </label>
                            </div>

                            <div className="min-h-0 flex-1 rounded-2xl border border-orange-100 bg-white/90 shadow-inner">
                                <div
                                    ref={editorRef}
                                    contentEditable
                                    suppressContentEditableWarning
                                    className={`editor-surface ${editorClassName} h-full overflow-y-auto rounded-2xl px-4 py-4 text-base text-gray-700 sm:px-5 sm:py-5 ${isEmpty ? 'editor-empty' : ''}`}
                                    data-placeholder={placeholder}
                                    onInput={persistEditorContent}
                                    onKeyDown={handleEditorKeyDown}
                                    onKeyUp={saveSelection}
                                    onMouseUp={saveSelection}
                                    onBlur={persistEditorContent}
                                />
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // --- ICONS ---
        const SunIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
        );
        const ClockIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );
        const ChevronRightIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );
        const ArrowLeftIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        );
        const CheckIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );
        const RefreshCwIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path>
            </svg>
        );

        // --- APP ---
        function MorningRitualApp() {
            const initialScreen = getScreenFromHash() || 'sunrise';
            const [currentScreen, setCurrentScreen] = useState(initialScreen);
            const [completedSteps, setCompletedSteps] = useState(new Set());
            const [currentTime, setCurrentTime] = useState('');
            const [currentDate, setCurrentDate] = useState('');
            const [showAnimation, setShowAnimation] = useState(initialScreen === 'sunrise');
            const [welcomeMessage, setWelcomeMessage] = useState('');
            const [finalMessage, setFinalMessage] = useState('');
            const [routineStartTime, setRoutineStartTime] = useState(null);
            const [elapsedTime, setElapsedTime] = useState(0);
            const [activeModalStep, setActiveModalStep] = useState(null);

            useEffect(() => {
                const handleHashChange = () => {
                    const screenFromHash = getScreenFromHash();
                    if (screenFromHash && screenFromHash !== currentScreen) {
                        setCurrentScreen(screenFromHash);
                        setShowAnimation(screenFromHash === 'sunrise');
                    }
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [currentScreen]);

            useEffect(() => {
                const targetHash = getHashFromScreen(currentScreen);
                if (window.location.hash !== targetHash) {
                    window.location.hash = targetHash;
                }
            }, [currentScreen]);

            useEffect(() => {
                setWelcomeMessage(generateWelcomeMessage());
                setFinalMessage(generateFinalMessage());
            }, []);

            useEffect(() => {
                let interval;
                if (routineStartTime) {
                interval = setInterval(() => {
                    const now = Date.now();
                    setElapsedTime(Math.floor((now - routineStartTime) / 1000));
                }, 1000);
                }
                return () => {
                if (interval) clearInterval(interval);
                };
            }, [routineStartTime]);

            useEffect(() => {
                const updateTime = () => {
                const now = new Date();
                const bogotaTime = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Bogota',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                }).format(now);
                
                const bogotaDate = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Bogota',
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }).format(now);
                
                setCurrentTime(bogotaTime);
                setCurrentDate(bogotaDate);
                };

                updateTime();
                const interval = setInterval(updateTime, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (currentScreen === 'sunrise') {
                const fadeTimer = setTimeout(() => {
                    setShowAnimation(false);
                }, 3000);
                
                const transitionTimer = setTimeout(() => {
                    setCurrentScreen('welcome');
                }, 4000);
                
                return () => {
                    clearTimeout(fadeTimer);
                    clearTimeout(transitionTimer);
                };
                }
            }, [currentScreen]);

            const generateWelcomeMessage = () => {
                const messages = [
                "The world is waking up with you, Diana. Your morning ritual is where transformation begins.",
                "Another sunrise, another chance to align with your highest self. Welcome to your sacred morning space.",
                "The early hours hold magic, and you're here to claim it. Let's begin this beautiful practice together.",
                "Your commitment to this morning ritual is a gift to your future self. Ready to make today remarkable?",
                "In the quiet of morning, your clearest intentions emerge. Welcome to this moment of pure possibility."
                ];
                
                return messages[Math.floor(Math.random() * messages.length)];
            };

            const generateFinalMessage = () => {
                const messages = [
                "You've honored your morning ritual with intention and care. Now step into your day as the grounded, centered person you've cultivated. The world needs your light.",
                "Ten steps completed, infinite possibilities ahead. You've given yourself the gift of presence and clarity. Go shine, Diana.",
                "Your morning practice is complete, but its effects ripple through everything you touch today. Trust in the foundation you've built.",
                "From sunrise animation to this moment - you've chosen growth, awareness, and intentional living. Your day is ready for you.",
                "The ritual is finished, but the magic you've created within yourself continues. Step forward with confidence and grace."
                ];
                
                return messages[Math.floor(Math.random() * messages.length)];
            };

            const formatElapsedTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const startRoutine = () => {
                setRoutineStartTime(Date.now());
                setCurrentScreen('step-1');
            };

            const ritualSteps = useMemo(() => ([
                { id: 1, title: "Greet Your Shiny Sunny 🌞", description: "Start your day with the bright light of your sunniest one." },
                { id: 2, title: "Waking Up Moment", description: "Ground yourself with mindful awareness", link: "https://app.wakingup.com/" },
                { id: 3, title: "Daily Check-In", description: "Review and affirm your daily commitments and PB journey", link: "https://habits.sadhanas.app/" },
                { id: 4, title: "Mantras", description: "Connect with your weekly mantras and affirmations" },
                { id: 5, title: "Lessons & Wisdom", description: "Reflect on key lessons from the past week and integrate them into your practice" },
                { id: 6, title: "Core Commitments", description: "Align with your deeper wisdom", link: "https://chatgpt.com/g/g-p-6a67f1db60388191b36c076d196af713/c/6a67f3a9-ee9c-83e9-8712-fd940b9ffafe" },
                { id: 7, title: "D RAM 2025 Review", description: "Review and reflect on your journal entries from one year ago" },
                { id: 8, title: "PDM Journaling", description: "Process your thoughts through morning journaling" },
                { id: 9, title: "Check In with Sunny 🌞", description: "Complete your MR checklist and do the PDM with your shiniest one." },
                { id: 10, title: "Start Workday with Stru", description: "Transition into productive work mode", link: "https://stru.sadhanas.app" }
            ]), []);

            const completeStep = (stepId) => {
                setCompletedSteps(prev => new Set([...prev, stepId]));
            };

            const goToNextStep = (stepId) => {
                if (stepId < TOTAL_STEPS) {
                setCurrentScreen(`step-${stepId + 1}`);
                } else {
                setCurrentScreen('complete');
                }
            };

            const goBack = () => {
                if (currentScreen === 'welcome') {
                setCurrentScreen('sunrise');
                setShowAnimation(true);
                } else if (currentScreen.startsWith('step-')) {
                const stepNumber = parseInt(currentScreen.split('-')[1]);
                if (stepNumber === 1) {
                    setCurrentScreen('welcome');
                } else {
                    setCurrentScreen(`step-${stepNumber - 1}`);
                }
                } else if (currentScreen === 'complete') {
                setCurrentScreen(`step-${TOTAL_STEPS}`);
                }
            };

            const resetApp = () => {
                setCurrentScreen('sunrise');
                setCompletedSteps(new Set());
                setShowAnimation(true);
                setRoutineStartTime(null);
                setElapsedTime(0);
                setWelcomeMessage(generateWelcomeMessage());
                setFinalMessage(generateFinalMessage());
                setActiveModalStep(null);
            };

            const openModalForStep = (stepId) => {
                if (MODAL_STEP_CONFIG[stepId]) {
                    setActiveModalStep(stepId);
                }
            };

            const closeModal = () => {
                setActiveModalStep(null);
            };

            const activeModalConfig = activeModalStep ? MODAL_STEP_CONFIG[activeModalStep] : null;

            // SCREEN: SUNRISE
            if (currentScreen === 'sunrise') {
                return (
                <div className="min-h-screen relative overflow-hidden bg-gradient-to-b from-indigo-900 via-purple-800 to-orange-400 transition-opacity duration-1000">
                    <div className={`absolute inset-0 flex items-center justify-center ${!showAnimation ? 'fade-out' : ''}`}>
                    <div className="sun-animation">
                        <div className="relative">
                        <div className="rays absolute inset-0 w-32 h-32">
                            <div className="absolute inset-0 bg-gradient-radial from-yellow-300/30 to-transparent rounded-full w-48 h-48 -translate-x-8 -translate-y-8"></div>
                        </div>
                        <SunIcon className="w-32 h-32 text-yellow-300" />
                        </div>
                    </div>
                    </div>
                </div>
                );
            }

            // SCREEN: WELCOME
            if (currentScreen === 'welcome') {
                return (
                <div className="min-h-screen bg-gradient-to-br from-orange-100 via-yellow-50 to-pink-100 p-6 fade-in">
                    <div className="max-w-md mx-auto pt-16 relative">
                    <div className="text-center">
                        <div className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-6 py-3 mb-6">
                        <ClockIcon className="w-5 h-5 text-orange-600" />
                        <span className="text-lg font-medium text-gray-700">{currentTime} • Bogotá</span>
                        </div>
                        
                        <h1 className="text-3xl font-bold text-gray-800 mb-4">Good Morning, Diana</h1>
                        <p className="text-gray-600 text-lg mb-12">{currentDate}</p>
                        
                        <div className="mb-12 px-4">
                        <p className="text-gray-700 text-xl leading-relaxed font-medium">
                            {welcomeMessage}
                        </p>
                        </div>
                        
                        <button
                        onClick={startRoutine}
                        className="w-full bg-gradient-to-r from-orange-400 to-pink-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2"
                        >
                        Begin Your Morning Ritual
                        <ChevronRightIcon className="w-5 h-5" />
                        </button>
                    </div>
                    </div>
                </div>
                );
            }

            // SCREEN: STEPS
            if (currentScreen.startsWith('step-')) {
                const stepNumber = parseInt(currentScreen.split('-')[1]);
                const step = ritualSteps[stepNumber - 1];
                const isCompleted = completedSteps.has(stepNumber);
                const totalSteps = TOTAL_STEPS;
                const hasModal = Boolean(MODAL_STEP_CONFIG[stepNumber]);

                return (
                <>
                <div className="min-h-screen bg-gradient-to-br from-orange-100 via-yellow-50 to-pink-100 p-6 relative">
                    {/* Back Button */}
                    <div className="absolute top-6 left-6 z-10">
                    <button onClick={goBack} className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2 text-gray-700 hover:bg-white/80 transition-all duration-300">
                        <ArrowLeftIcon className="w-4 h-4" />
                        Back
                    </button>
                    </div>
                    
                    <div className="max-w-[34rem] mx-auto pt-10">
                    {/* Progress */}
                    <div className="mb-2">
                        <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-medium text-gray-600">Step {stepNumber} of {totalSteps}</span>
                        <span className="text-sm font-medium text-gray-600">{Math.round((stepNumber / totalSteps) * 100)}%</span>
                        </div>
                        <div className="w-full bg-white/60 rounded-full h-2">
                        <div className="bg-gradient-to-r from-orange-400 to-pink-400 h-2 rounded-full transition-all duration-500" style={{ width: `${(stepNumber / totalSteps) * 100}%` }}></div>
                        </div>
                    </div>
                    
                    {/* Timer */}
                    {routineStartTime && (
                        <div className="flex justify-center mt-5 mb-6 sm:mt-5 sm:mb-5">
                        <div className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2">
                            <ClockIcon className="w-4 h-4 text-orange-600" />
                            <span className="text-sm font-medium text-gray-700">{formatElapsedTime(elapsedTime)}</span>
                        </div>
                        </div>
                    )}

                    {/* Content */}
                    <div className="bg-white/70 backdrop-blur-sm rounded-3xl p-8 shadow-lg mb-8 text-center">
                        <div className="inline-flex items-center justify-center w-12 h-12 bg-gradient-to-r from-orange-400 to-pink-400 rounded-full mb-6">
                        <span className="text-white text-lg font-bold">{stepNumber}</span>
                        </div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-4">{step.title}</h2>
                        <p className="text-gray-600 text-lg mb-6">{step.description}</p>
                        
                        {step.link && (
                        <a href={step.link} target="_blank" rel="noopener noreferrer" className="inline-block bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-6 py-3 rounded-xl font-semibold mb-6 hover:shadow-lg transition-all duration-300">
                            Open Link →
                        </a>
                        )}

                        {hasModal && (
                        <div className="mb-2">
                            <button
                            type="button"
                            onClick={() => openModalForStep(stepNumber)}
                            className="inline-block bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all duration-300"
                            >
                            Open
                            </button>
                        </div>
                        )}
                    </div>

                    {/* Buttons */}
                    <div className="space-y-4">
                        {!isCompleted && (
                        <button onClick={() => completeStep(stepNumber)} className="w-full bg-gradient-to-r from-lime-400 to-green-500 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                            <CheckIcon className="w-5 h-5" />
                            Mark Complete
                        </button>
                        )}
                        
                        {isCompleted && (
                        <button onClick={() => goToNextStep(stepNumber)} className="w-full bg-gradient-to-r from-orange-400 to-pink-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                            {stepNumber === totalSteps ? 'Complete Ritual' : 'Next Step'}
                            <ChevronRightIcon className="w-5 h-5" />
                        </button>
                        )}
                    </div>
                    </div>
                </div>
                {activeModalConfig && (
                    <RichTextModal
                    isOpen={Boolean(activeModalConfig)}
                    title={activeModalConfig.title}
                    headerLabel={activeModalConfig.headerLabel}
                    storageKey={activeModalConfig.storageKey}
                    starterContent={STARTER_CONTENT[activeModalConfig.key]}
                    placeholder={activeModalConfig.placeholder}
                    editorClassName={activeModalConfig.editorClassName || ''}
                    onClose={closeModal}
                    />
                )}
                </>
                );
            }

            // SCREEN: COMPLETE
            if (currentScreen === 'complete') {
                return (
                <div className="min-h-screen bg-gradient-to-br from-orange-100 via-yellow-50 to-pink-100 p-6 relative">
                    <div className="absolute top-6 left-6">
                    <button onClick={goBack} className="inline-flex items-center gap-2 bg-white/60 backdrop-blur-sm rounded-full px-4 py-2 text-gray-700 hover:bg-white/80 transition-all duration-300">
                        <ArrowLeftIcon className="w-4 h-4" />
                        Back
                    </button>
                    </div>
                    
                    <div className="max-w-md mx-auto pt-16">
                    <div className="text-center mb-8">
                        <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-green-400 to-emerald-500 rounded-full mb-6">
                        <CheckIcon className="w-10 h-10 text-white" />
                        </div>
                        
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Ritual Complete! ✨</h1>
                        {routineStartTime && (
                        <p className="text-gray-600 text-base mb-9">
                            Total time: <span className="font-semibold text-orange-600 text-2xl">{formatElapsedTime(elapsedTime)}</span>
                        </p>
                        )}
                    </div>

                    <div className="text-center mb-12 px-4">
                        <p className="text-gray-700 text-xl leading-relaxed font-medium">
                        {finalMessage}
                        </p>
                    </div>

                    <button onClick={resetApp} className="w-full bg-gradient-to-r from-orange-400 to-pink-400 text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                        <RefreshCwIcon className="w-5 h-5" />
                        Start New Ritual
                    </button>
                    </div>
                </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MorningRitualApp />);
    </script>
</body>
</html>
